# Spring Application Configuration
spring.application.name=doctype-backend
server.port=8081

# Database H2 (local development)
spring.datasource.url=jdbc:h2:mem:doctype;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT Configuration
app.jwt.secret=8fK29xLmPq7R2vN5aBcD9eFgHjKlMnOpQrStUvWxYz123456
app.jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.doctype=DEBUG

# Error Handling
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
